# Deploys the analysis server to Fly.
#
# This is deliberately separate from the Pages workflow. Publishing the
# static site bakes answers in at build time; this deploys the code that
# computes them on demand, so the two are not on the same schedule and a
# recalculation never needs a deploy.
name: Deploy server

on:
  push:
    branches: [main]
    # Only the things that change what the server does. A front-end-only
    # change still ships, because the binary embeds the front end.
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Without a token there is nothing to deploy to, and that is a
      # configuration gap rather than a broken build: say so and stop,
      # the way the Pages workflow handles Pages not being enabled.
      - name: Is Fly configured?
        id: fly
        env:
          TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FLY_API_TOKEN is not set, so nothing was deployed. Add it under Settings -> Secrets and variables -> Actions."
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.fly.outputs.ready == 'true'

      # Create the app and its volume if they are not there yet, so the
      # only thing anyone has to do by hand is produce a token. Both steps
      # are no-ops once they exist, which makes a first deploy and the
      # hundredth the same command.
      - name: Make sure the app and volume exist
        if: steps.fly.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
        run: |
          set -euo pipefail
          app=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['app'])")
          region=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['primary_region'])")
          volume=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['mounts']['source'])")

          if flyctl apps list --json | python3 -c "import json,sys; sys.exit(0 if '$app' in [a['Name'] for a in json.load(sys.stdin)] else 1)"; then
            echo "app $app already exists"
          else
            echo "creating app $app in org $FLY_ORG"
            # Fly app names are globally unique, so a clash here is a name
            # collision with a stranger's app, not a broken workflow.
            if ! flyctl apps create "$app" --org "$FLY_ORG"; then
              echo "::error::Could not create the Fly app '$app'. App names are global, so it may be taken. Change the 'app' name in fly.toml and push again."
              exit 1
            fi
          fi

          if flyctl volumes list -a "$app" --json | python3 -c "import json,sys; sys.exit(0 if any(v['name'] == '$volume' for v in json.load(sys.stdin)) else 1)"; then
            echo "volume $volume already exists"
          else
            echo "creating a 3GB volume '$volume' in $region"
            flyctl volumes create "$volume" -a "$app" -r "$region" -n 1 -s 3 --yes
          fi

      - name: Deploy
        if: steps.fly.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --wait-timeout 10m

      # A failed deploy is usually the machine refusing to start, and the
      # reason is in its logs rather than in flyctl's output. Print them
      # here or the next person debugging this is guessing.
      - name: Machine logs
        if: failure() && steps.fly.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl logs --no-tail | tail -100 || echo "no logs available"

      # A deploy that reports success while serving errors is worse than a
      # failed one, so prove the running machine answers before finishing.
      - name: Check it is serving
        if: steps.fly.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['app'])")
          url="https://$app.fly.dev"
          echo "checking $url"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url/" || echo 000)
            if [ "$code" = "200" ]; then
              echo "::notice::$url is serving (HTTP 200)."
              exit 0
            fi
            echo "attempt $attempt: HTTP $code, waiting for the machine to start"
            sleep 10
          done
          echo "::error::$url did not return 200. Recent logs:"
          flyctl logs --no-tail | tail -50
          exit 1
