# Destroys a Fly app and everything attached to it, including its volumes.
#
# This is a one-off tool, kept deliberately separate from the deploy so that
# nothing destructive can ride along with a push. It only runs when somebody
# asks for it by name, and it refuses to touch the app this repository
# currently deploys.
name: Destroy a Fly app

on:
  workflow_dispatch:
    inputs:
      app:
        description: Name of the Fly app to destroy, exactly
        required: true
      confirm:
        description: Type DESTROY to confirm
        required: true

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Destroy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: ${{ inputs.app }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "::error::Confirmation was '$CONFIRM', expected DESTROY. Nothing was touched."
            exit 1
          fi

          live=$(python3 -c "import tomllib; print(tomllib.load(open('fly.toml','rb'))['app'])")
          if [ "$APP" = "$live" ]; then
            echo "::error::'$APP' is the app this repository deploys. Refusing."
            exit 1
          fi

          echo "Destroying $APP (the live app is $live, untouched)."
          flyctl apps destroy "$APP" --yes
          echo "::notice::Destroyed $APP and its volumes."

          echo "Remaining apps:"
          flyctl apps list
